# Portainer CE: panel de administración de la plataforma RentaMovil.
#
# Es un compose APARTE a propósito. La capa de publicación (nginx + TLS) es la
# que sostiene el sitio en producción y no debe depender de que este panel se
# levante bien: si Portainer falla, el sitio sigue en pie. Los dos archivos
# comparten la red externa "rentamovil", así que nginx puede resolver el alias
# "portainer" igual que resuelve "api-gateway" o "web" (que viven en otros
# proyectos de compose).
#
# Levantar:
#   1) cp .env.example .env   y pon una contraseña de mínimo 12 caracteres
#   2) docker compose -f docker-compose.portainer.yml up -d
#   3) bash scripts/crear-admin-portainer.sh   (crea el usuario admin)
#
# Ver el README para el detalle (DNS, certificado, acceso y respaldo).
services:
  portainer:
    image: portainer/portainer-ce:lts
    container_name: rentamovil-portainer
    restart: always

    # Flags reales de Portainer 2.4x (verificados contra la imagen):
    #   --bind        puerto HTTP interno (9000): es el que consume el proxy de nginx.
    #   --bind-https  puerto HTTPS del propio panel (9443): atado a 127.0.0.1 en el host.
    #   --trusted-origins  origen permitido para la protección CSRF del panel, ya que
    #                   entra por un subdominio distinto al del sitio.
    # OJO: --host NO es la dirección de escucha, es el endpoint de la API de
    # Docker (para el agente) y hace fallar el arranque si se le pasa una IP.
    command:
      - --bind=0.0.0.0:9000
      - --bind-https=0.0.0.0:9443
      - --trusted-origins=https://admin.rentamovil.tech

    # El socket de Docker es lo que permite al panel listar y operar los
    # contenedores del host. Acceso equivalente a root en el servidor: por eso
    # el puerto publicado se ata a 127.0.0.1 y nunca queda expuesto a Internet.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

    ports:
      # Sólo desde el host. El acceso público es por https://admin.rentamovil.tech
      # (a través de nginx) o por túnel SSH:
      #   ssh -L 9443:127.0.0.1:9443 root@<IP_DEL_VPS>
      - "127.0.0.1:9443:9443"

    networks:
      rentamovil:
        # nginx hace proxy hacia http://portainer:9000 (el puerto HTTP interno).
        aliases: [portainer]

    healthcheck:
      # La imagen de Portainer no tiene shell (ni wget, ni curl): el healthcheck
      # tiene que ser forma CMD, no CMD-SHELL. /portainer --version ejecuta el
      # propio binario, imprime la versión y sale con código 0.
      test: ["CMD", "/portainer", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  # Datos del panel: usuarios, organizaciones, endpoints, tokens de registro.
  portainer_data:

networks:
  rentamovil:
    external: true
