worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Mismo truco que vite.config.js: sin el header Origin, para el backend es una llamada
    # servidor-a-servidor, no aplica CORS.
    proxy_set_header Origin "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Para el websocket del panel de Portainer: se sube la conexión sólo si el
    # cliente realmente la está pidiendo, y se cierra en el resto de casos
    # (si no, cada petición HTTP normal dejaría una conexión abierta).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Todo lo que llega por HTTP se manda a HTTPS, salvo la verificación de Certbot
    # (necesita esta ruta libre por HTTP para emitir y renovar el certificado sin tumbar el sitio).
    server {
        listen 80;
        server_name rentamovil.tech www.rentamovil.tech admin.rentamovil.tech;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name rentamovil.tech www.rentamovil.tech;

        ssl_certificate     /etc/letsencrypt/live/rentamovil.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rentamovil.tech/privkey.pem;

        # API real (iam, fleet, booking, payment, telemetry) a través del API Gateway.
        # El front web y la app móvil llaman a /api/... en el mismo origen; aquí se quita el
        # prefijo antes de reenviar, igual que el proxy de Vite en desarrollo.
        location /api/ {
            proxy_pass http://api-gateway:8080/;
        }

        # Front web (build de producción, servido por "vite preview" en el contenedor "web").
        location / {
            proxy_pass http://web:4173/;
        }
    }

    # Panel de administración (Portainer CE) en un subdominio aparte, con su
    # propio certificado. Se publica aquí en vez de exponer el 9443 del
    # contenedor: así el panel entra por 443 con TLS válido y su puerto real
    # queda atado a 127.0.0.1 en el host.
    server {
        listen 443 ssl;
        server_name admin.rentamovil.tech;

        ssl_certificate     /etc/letsencrypt/live/admin.rentamovil.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/admin.rentamovil.tech/privkey.pem;

        # El panel permite subir imágenes al registro: sin esto, nginx cortaría
        # las cargas grandes con 413.
        client_max_body_size 0;

        location / {
            # El puerto 9000 del contenedor es el HTTP interno de Portainer; el
            # TLS lo termina nginx. El alias "portainer" vive en la red
            # externa "rentamovil", la misma que usa la capa de publicación.
            proxy_pass http://portainer:9000;

            # A diferencia del resto del stack, aquí el Origin sí se reenvía:
            # el panel valida el origen de su propio websocket.
            proxy_set_header Origin $http_origin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;

            # Websocket: la consola del panel (exec, logs en vivo) lo usa.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Conexiones largas: la consola interactiva puede quedar abierta
            # mucho tiempo sin tráfico.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
