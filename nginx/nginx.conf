worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Mismo truco que vite.config.js: sin el header Origin, para el backend es una llamada
    # servidor-a-servidor, no aplica CORS.
    proxy_set_header Origin "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Todo lo que llega por HTTP se manda a HTTPS, salvo la verificación de Certbot
    # (necesita esta ruta libre por HTTP para emitir y renovar el certificado sin tumbar el sitio).
    server {
        listen 80;
        server_name rentamovil.tech www.rentamovil.tech;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name rentamovil.tech www.rentamovil.tech;

        ssl_certificate     /etc/letsencrypt/live/rentamovil.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rentamovil.tech/privkey.pem;

        # API real (iam, fleet, booking, payment, telemetry) a través del API Gateway.
        # El front web y la app móvil llaman a /api/... en el mismo origen; aquí se quita el
        # prefijo antes de reenviar, igual que el proxy de Vite en desarrollo.
        location /api/ {
            proxy_pass http://api-gateway:8080/;
        }

        # Lo que todavía no tiene servicio real (ver REAL_BACKEND_PREFIXES en httpClient.js).
        location /mock/ {
            proxy_pass http://mock-api:3100/;
        }

        # Front web (build de producción, servido por "vite preview" en el contenedor "web").
        location / {
            proxy_pass http://web:4173/;
        }
    }
}
