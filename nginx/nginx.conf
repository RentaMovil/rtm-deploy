worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Mismo truco que vite.config.js: sin el header Origin, para el backend es una llamada
    # servidor-a-servidor, no aplica CORS. Así funciona igual abriendo la app por el túnel de ngrok.
    proxy_set_header Origin "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;
        server_name _;

        # API real (iam, fleet, booking, payment) a través del API Gateway.
        # El front web y la app móvil llaman a /api/... en el mismo origen; aquí se quita el
        # prefijo antes de reenviar, igual que el proxy de Vite en desarrollo.
        location /api/ {
            proxy_pass http://api-gateway:8080/;
        }

        # Lo que todavía no tiene servicio real (ver REAL_BACKEND_PREFIXES en httpClient.js).
        location /mock/ {
            proxy_pass http://mock-api:3100/;
        }

        # Front web (build de producción, servido por "vite preview" en el contenedor "web").
        location / {
            proxy_pass http://web:4173/;
        }
    }
}
