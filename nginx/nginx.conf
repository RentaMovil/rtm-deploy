worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Mismo truco que vite.config.js: sin el header Origin, para el backend es una llamada
    # servidor-a-servidor, no aplica CORS.
    proxy_set_header Origin "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Todo lo que llega por HTTP se manda a HTTPS, salvo la verificación de Certbot
    # (necesita esta ruta libre por HTTP para emitir y renovar el certificado sin tumbar el sitio).
    server {
        listen 80;
        server_name rentamovil.tech www.rentamovil.tech;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name rentamovil.tech www.rentamovil.tech;

        ssl_certificate     /etc/letsencrypt/live/rentamovil.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/rentamovil.tech/privkey.pem;

        # Security headers. "always" sends them on error responses too (4xx/5xx), not just 2xx.
        # No "preload" on HSTS: that flag is nearly impossible to undo once submitted to browsers'
        # preload lists (months to roll back), so it's left for later once the domain is stable.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # script-src hash matches the inline theme-bootstrap <script> in index.html verbatim
        # (RentaMovil/web/Front-end/index.html) - recompute it if that inline script ever changes.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-G9i+Hn7/XljpirKSs/aNp9FCgL2cMokJq751OjOCVxk='; style-src 'self'; img-src 'self' data: https://flagcdn.com https://res.cloudinary.com https://*.tile.openstreetmap.org; font-src 'self'; connect-src 'self' https://api.cloudinary.com https://github.com https://objects.githubusercontent.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

        # Campanita en vivo (SSE): va directo a booking-reservation, sin pasar por el Gateway.
        # Spring Cloud Gateway Server WebMVC es bloqueante y puede bufferear la respuesta completa
        # antes de reenviarla, lo que rompe un stream que no termina nunca. Acá se apaga el
        # buffering de nginx y se alarga el timeout: si no, la conexión se corta a los 60s.
        location = /api/notifications/stream {
            proxy_pass http://booking-reservation:3003/notifications/stream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }

        # API real (iam, fleet, booking, payment, telemetry) a través del API Gateway.
        # El front web y la app móvil llaman a /api/... en el mismo origen; aquí se quita el
        # prefijo antes de reenviar, igual que el proxy de Vite en desarrollo.
        location /api/ {
            proxy_pass http://api-gateway:8080/;
        }

        # Front web (build de producción, servido por "vite preview" en el contenedor "web").
        location / {
            proxy_pass http://web:4173/;
        }
    }
}
