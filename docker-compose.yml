# Capa de publicación: nginx como proxy inverso delante de todo el stack, con HTTPS real
# (Let's Encrypt) sobre rentamovil.tech. Sin tocar ningún repo de servicio.
#
# Requiere que ya estén arriba (en este orden, cada uno desde su propio repo):
#   rtm-iam-db -> rtm-fleet-maintenance-db -> rtm-booking-db -> rtm-payment-billing-db ->
#   rtm-telemetry-gps-db -> rtm-iam -> rtm-fleet-maintenance -> rtm-booking-reservation ->
#   rtm-payment-billing -> rtm-telemetry-gps -> rtm-api-gateway ->
#   rtm-frontend/web/Front-end (docker compose up -d --build)
#
# Todos en la misma red externa "rentamovil" (docker network create rentamovil, una sola vez).
#
# El certificado de Let's Encrypt vive en el filesystem del VPS (/etc/letsencrypt), generado por
# certbot fuera de Docker (ver README). nginx solo lo monta de solo lectura.
#
# El panel de administración (Portainer CE) NO está aquí: va en
# docker-compose.portainer.yml, aparte a propósito, para que la capa que sostiene el
# sitio en producción no dependa de que el panel levante bien.
services:
  nginx:
    image: nginx:latest
    container_name: rentamovil-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot-www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    networks: [rentamovil]
    restart: unless-stopped

networks:
  rentamovil:
    external: true
